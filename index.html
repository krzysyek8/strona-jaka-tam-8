<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERA SAMOOBSŁUGI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
    .song-row:hover { background-color: #2a2a2a; }
    .progress-bar { height: 4px; background: #22c55e; transition: width 0.1s; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

<div class="max-w-7xl mx-auto flex">
  <!-- Sidebar -->
  <div class="w-72 bg-black h-screen p-6 fixed flex flex-col">
    <div class="flex items-center gap-3 mb-10">
      <i class="fa-solid fa-music text-4xl text-green-500"></i>
      <h1 class="text-3xl font-bold">ERA SAMOOBSŁUGI</h1>
    </div>

    <button onclick="document.getElementById('fileInput').click()" 
            class="w-full bg-green-600 hover:bg-green-500 py-4 rounded-2xl font-semibold flex items-center justify-center gap-3 mb-6">
      <i class="fa-solid fa-upload"></i> DODAJ UTWÓR
    </button>
    <input type="file" id="fileInput" accept="audio/*" class="hidden" onchange="uploadSong(event)">

    <nav class="space-y-2">
      <a href="#" onclick="showPlaylist('all')" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-zinc-800" id="nav-all">
        <i class="fa-solid fa-list"></i> Wszystkie utwory
      </a>
      <a href="#" onclick="showPlaylist('favorites')" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-zinc-800" id="nav-favorites">
        <i class="fa-solid fa-heart"></i> Ulubione
      </a>
    </nav>
  </div>

  <!-- Główna treść -->
  <div class="ml-72 flex-1 p-8">
    <h1 class="text-4xl font-bold mb-8" id="pageTitle">Biblioteka</h1>
    
    <input id="search" type="text" placeholder="Szukaj utworu lub artysty..." 
           class="w-full max-w-lg bg-zinc-900 border border-zinc-700 rounded-full px-6 py-3 mb-10 focus:outline-none focus:border-green-500"
           onkeyup="filterSongs()">

    <table class="w-full">
      <thead>
        <tr class="border-b border-zinc-800 text-zinc-400">
          <th class="text-left py-4 w-12">#</th>
          <th class="text-left">Tytuł</th>
          <th class="text-left">Wykonawca</th>
          <th class="w-44"></th>
        </tr>
      </thead>
      <tbody id="songList" class="text-zinc-200"></tbody>
    </table>
  </div>
</div>

<!-- Zaawansowany Player -->
<div class="fixed bottom-0 left-0 right-0 bg-zinc-900 border-t border-zinc-700 h-24 flex items-center px-8 gap-6">
  <div class="flex items-center gap-4 w-80">
    <div id="playerCover" class="w-14 h-14 bg-zinc-800 rounded-lg overflow-hidden flex-shrink-0">
      <i class="fa-solid fa-music text-2xl flex items-center justify-center h-full"></i>
    </div>
    <div class="min-w-0">
      <div id="playerTitle" class="font-medium truncate">Wybierz utwór</div>
      <div id="playerArtist" class="text-sm text-zinc-400 truncate">-</div>
    </div>
  </div>

  <div class="flex-1 flex flex-col items-center">
    <div class="flex items-center gap-6 mb-2">
      <button onclick="toggleRepeat()" id="repeatBtn" class="text-zinc-400 hover:text-white"><i class="fa-solid fa-repeat"></i></button>
      <button onclick="prevTrack()" class="text-xl text-zinc-400 hover:text-white"><i class="fa-solid fa-backward"></i></button>
      <button onclick="togglePlay()" id="playBtn" class="w-12 h-12 bg-white text-black rounded-full flex items-center justify-center hover:scale-105 transition">
        <i class="fa-solid fa-play"></i>
      </button>
      <button onclick="nextTrack()" class="text-xl text-zinc-400 hover:text-white"><i class="fa-solid fa-forward"></i></button>
    </div>

    <div class="w-full max-w-md flex items-center gap-3 text-xs">
      <span id="currentTime">0:00</span>
      <div class="flex-1 h-1 bg-zinc-700 rounded-full relative cursor-pointer" onclick="seek(event)">
        <div id="progress" class="progress-bar w-0 rounded-full absolute top-0 left-0"></div>
      </div>
      <span id="duration">0:00</span>
    </div>
  </div>
</div>

<!-- Modal edycji -->
<div id="editModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
  <div class="bg-zinc-900 rounded-2xl w-full max-w-md p-8">
    <h2 class="text-2xl font-bold mb-6">Edytuj utwór</h2>
    <!-- ... (modal edycji bez zmian) ... -->
  </div>
</div>

<audio id="audio" class="hidden"></audio>

<script>
// ================== SUPABASE ==================
const SUPABASE_URL = "https://nzlqzulzlduhiuuomozk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56bHF6dWx6bGR1aGl1dW9tb3prIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMzA4NzksImV4cCI6MjA5MzgwNjg3OX0.Gqig92ysRncRxPYb9z3L_aBc-daedaw4dpZhN9Grh9A";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let songs = [];
let currentIndex = -1;
let isRepeat = false;
let currentPlaylist = 'all'; // 'all' lub 'favorites'
let audio = document.getElementById('audio');

async function loadSongs() {
  const { data, error } = await supabaseClient.from('songs').select('*').order('created_at', { ascending: false });
  if (error) console.error(error);
  songs = data || [];
  renderSongs();
}

// ================== UPLOAD, RENDER, PLAY ==================
async function uploadSong(e) { /* bez zmian z poprzedniej wersji */ }

// Render
function renderSongs(filtered = null) {
  const list = filtered || songs;
  const tbody = document.getElementById('songList');
  tbody.innerHTML = '';

  list.forEach((song, i) => {
    const tr = document.createElement('tr');
    tr.className = "song-row border-b border-zinc-800 h-16 hover:bg-zinc-800 cursor-pointer";
    tr.innerHTML = `
      <td class="pl-6">${i+1}</td>
      <td class="font-medium">${song.title}</td>
      <td class="text-zinc-400">${song.artist}</td>
      <td class="pr-6 text-right flex gap-2 justify-end">
        <button onclick="toggleFavorite('${song.id}'); event.stopImmediatePropagation()" class="px-3 py-1 ${song.is_favorite ? 'text-red-500' : 'text-zinc-400'}">
          <i class="fa-solid fa-heart"></i>
        </button>
        <button onclick="editSong('${song.id}'); event.stopImmediatePropagation()" class="bg-blue-600 hover:bg-blue-500 px-4 py-1.5 rounded-lg">✏️</button>
        <button onclick="deleteSong('${song.id}'); event.stopImmediatePropagation()" class="bg-red-600 hover:bg-red-500 px-4 py-1.5 rounded-lg">🗑</button>
        <button onclick="playSong(${songs.indexOf(song)})" class="bg-green-600 hover:bg-green-500 px-6 py-1.5 rounded-lg">Odtwórz</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

// Odtwarzanie
function playSong(index) {
  currentIndex = index;
  const song = songs[index];
  const { data } = supabaseClient.storage.from('songs').getPublicUrl(song.file_path);

  document.getElementById('playerTitle').textContent = song.title;
  document.getElementById('playerArtist').textContent = song.artist;

  audio.src = data.publicUrl;
  audio.play();
  updatePlayButton();
}

function togglePlay() {
  audio.paused ? audio.play() : audio.pause();
  updatePlayButton();
}

function updatePlayButton() {
  const btn = document.getElementById('playBtn');
  btn.innerHTML = audio.paused ? `<i class="fa-solid fa-play"></i>` : `<i class="fa-solid fa-pause"></i>`;
}

// Progress bar
audio.ontimeupdate = () => {
  const percent = (audio.currentTime / audio.duration) * 100 || 0;
  document.getElementById('progress').style.width = percent + '%';
  document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
  document.getElementById('duration').textContent = formatTime(audio.duration);
};

function seek(e) {
  const rect = e.currentTarget.getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  audio.currentTime = percent * audio.duration;
}

function formatTime(seconds) {
  if (!seconds || isNaN(seconds)) return "0:00";
  const min = Math.floor(seconds / 60);
  const sec = Math.floor(seconds % 60);
  return `${min}:${sec < 10 ? '0' : ''}${sec}`;
}

function toggleRepeat() {
  isRepeat = !isRepeat;
  document.getElementById('repeatBtn').style.color = isRepeat ? '#22c55e' : '';
}

audio.onended = () => {
  if (isRepeat) audio.play();
  else if (currentIndex < songs.length - 1) playSong(currentIndex + 1);
};

// Usuwanie
async function deleteSong(id) {
  if (!confirm("Na pewno chcesz usunąć ten utwór?")) return;
  
  const { error } = await supabaseClient.from('songs').delete().eq('id', id);
  if (error) alert("Błąd usuwania");
  else loadSongs();
}

// Ulubione (prosta implementacja playlist)
async function toggleFavorite(id) {
  // Na razie symulujemy - w przyszłości można dodać tabelę playlist
  const song = songs.find(s => s.id === id);
  song.is_favorite = !song.is_favorite;
  renderSongs();
}

function showPlaylist(type) {
  currentPlaylist = type;
  document.getElementById('nav-all').classList.toggle('bg-zinc-800', type === 'all');
  document.getElementById('nav-favorites').classList.toggle('bg-zinc-800', type === 'favorites');
  
  if (type === 'favorites') {
    const favorites = songs.filter(s => s.is_favorite);
    renderSongs(favorites);
    document.getElementById('pageTitle').textContent = "Ulubione";
  } else {
    renderSongs();
    document.getElementById('pageTitle').textContent = "Biblioteka";
  }
}

function filterSongs() {
  const term = document.getElementById('search').value.toLowerCase();
  const filtered = songs.filter(s => 
    s.title.toLowerCase().includes(term) || 
    s.artist.toLowerCase().includes(term)
  );
  renderSongs(filtered);
}

// Inicjalizacja
loadSongs();
</script>
</body>
</html>
