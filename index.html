<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERA SAMOOBSŁUGI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; }
    .song-row:hover { background-color: #2a2a2a; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

<div class="max-w-7xl mx-auto flex">
  <div class="w-72 bg-black h-screen p-6 fixed flex flex-col">
    <div class="flex items-center gap-3 mb-10">
      <i class="fa-solid fa-music text-4xl text-green-500"></i>
      <h1 class="text-3xl font-bold">ERA SAMOOBSŁUGI</h1>
    </div>

    <button onclick="document.getElementById('fileInput').click()" 
            class="w-full bg-green-600 hover:bg-green-500 py-4 rounded-2xl font-semibold flex items-center justify-center gap-3 mb-8">
      <i class="fa-solid fa-upload"></i> DODAJ UTWÓR
    </button>
    <input type="file" id="fileInput" accept="audio/*" class="hidden" onchange="uploadSong(event)">
  </div>

  <div class="ml-72 flex-1 p-8">
    <h1 class="text-4xl font-bold mb-8">Biblioteka</h1>
    
    <table class="w-full">
      <thead>
        <tr class="border-b border-zinc-800 text-zinc-400">
          <th class="text-left py-4 w-12">#</th>
          <th class="text-left">Tytuł</th>
          <th class="text-left">Wykonawca</th>
          <th class="w-52"></th>
        </tr>
      </thead>
      <tbody id="songList" class="text-zinc-200"></tbody>
    </table>
  </div>
</div>

<!-- Modal edycji -->
<div id="editModal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
  <div class="bg-zinc-900 rounded-2xl w-full max-w-md p-8">
    <h2 class="text-2xl font-bold mb-6">Edytuj utwór</h2>
    <input id="editTitle" class="w-full bg-zinc-800 rounded-xl px-5 py-3 mb-4" placeholder="Tytuł">
    <input id="editArtist" class="w-full bg-zinc-800 rounded-xl px-5 py-3 mb-6" placeholder="Wykonawca">
    <div class="flex gap-3">
      <button onclick="closeModal()" class="flex-1 py-3 bg-zinc-800 rounded-xl">Anuluj</button>
      <button onclick="saveEdit()" class="flex-1 py-3 bg-green-600 rounded-xl">Zapisz zmiany</button>
    </div>
  </div>
</div>

<audio id="audio" class="hidden"></audio>

<script>
// ================== KONFIG ==================
const SUPABASE_URL = "https://nzlqzulzlduhiuuomozk.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im56bHF6dWx6bGR1aGl1dW9tb3prIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgyMzA4NzksImV4cCI6MjA5MzgwNjg3OX0.Gqig92ysRncRxPYb9z3L_aBc-daedaw4dpZhN9Grh9A";
const ADMIN_PASSWORD = "era2025";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let songs = [];
let currentEditId = null;

// Ładowanie
async function loadSongs() {
  const { data } = await supabaseClient.from('songs').select('*').order('created_at', { ascending: false });
  songs = data || [];
  renderSongs();
}

function renderSongs() {
  const tbody = document.getElementById('songList');
  tbody.innerHTML = '';

  songs.forEach((song, i) => {
    const tr = document.createElement('tr');
    tr.className = "song-row border-b border-zinc-800 h-16 hover:bg-zinc-800 cursor-pointer";
    tr.innerHTML = `
      <td class="pl-6">${i+1}</td>
      <td class="font-medium">${song.title}</td>
      <td class="text-zinc-400">${song.artist}</td>
      <td class="pr-6 text-right flex gap-2 justify-end">
        <button onclick="startEdit('${song.id}')" class="bg-blue-600 hover:bg-blue-500 px-4 py-1.5 rounded-lg">✏️</button>
        <button onclick="deleteSong('${song.id}')" class="bg-red-600 hover:bg-red-500 px-4 py-1.5 rounded-lg">🗑</button>
        <button onclick="playSong(${i})" class="bg-green-600 hover:bg-green-500 px-6 py-1.5 rounded-lg">Odtwórz</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

// Upload
async function uploadSong(e) {
  const file = e.target.files[0];
  if (!file) return;
  const title = prompt("Tytuł utworu:", file.name.replace(/\.[^/.]+$/, "")) || file.name;
  const artist = prompt("Wykonawca:", "Nieznany") || "Nieznany";
  const fileName = `${Date.now()}-${file.name.replace(/[^a-zA-Z0-9.-]/g, "_")}`;

  const { error: upErr } = await supabaseClient.storage.from('songs').upload(fileName, file, { upsert: true });
  if (upErr) return alert("Błąd uploadu: " + upErr.message);

  const { error: dbErr } = await supabaseClient.from('songs').insert({ title, artist, file_path: fileName });
  if (dbErr) alert("Błąd bazy");
  else { alert("✅ Dodano!"); loadSongs(); }
}

// Edycja
function startEdit(id) {
  const pass = prompt("Podaj hasło do edycji:");
  if (pass !== ADMIN_PASSWORD) return alert("❌ Złe hasło!");

  currentEditId = id;
  const song = songs.find(s => s.id === id);
  if (!song) return;

  document.getElementById('editTitle').value = song.title;
  document.getElementById('editArtist').value = song.artist;
  document.getElementById('editModal').classList.remove('hidden');
}

async function saveEdit() {
  if (!currentEditId) return;

  const title = document.getElementById('editTitle').value;
  const artist = document.getElementById('editArtist').value;

  const { error } = await supabaseClient.from('songs').update({ title, artist }).eq('id', currentEditId);

  if (error) alert("Błąd: " + error.message);
  else {
    alert("✅ Zapisano zmiany!");
    closeModal();
    loadSongs();
  }
}

function closeModal() {
  document.getElementById('editModal').classList.add('hidden');
  currentEditId = null;
}

// Usuwanie
async function deleteSong(id) {
  const pass = prompt("Podaj hasło do usunięcia:");
  if (pass !== ADMIN_PASSWORD) return alert("❌ Złe hasło!");

  if (!confirm("Na pewno usunąć ten utwór?")) return;

  const { error } = await supabaseClient.from('songs').delete().eq('id', id);
  if (error) alert("Błąd: " + error.message);
  else {
    alert("✅ Usunięto!");
    loadSongs();
  }
}

function playSong(i) {
  const song = songs[i];
  const { data } = supabaseClient.storage.from('songs').getPublicUrl(song.file_path);
  document.getElementById('playerTitle').textContent = song.title;
  document.getElementById('playerArtist').textContent = song.artist;
  audio.src = data.publicUrl;
  audio.play();
}

// Start
loadSongs();
</script>
</body>
</html>
